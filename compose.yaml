version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Volume condiviso per le clip
      - clips_volume:/app/downloads
      # Volume per il codice sorgente (hot-reload locale)
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Escludi i node_modules locali per usare quelli nel container
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  # Volume per la persistenza delle clip
  clips_volume:
